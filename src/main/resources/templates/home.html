<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}">
    <head>
        <title>홈화면</title>
    </head>
    <div layout:fragment="content">
        <table class="table table-striped">
            <thead>
                <tr>
                    <th scope="col">#</th>
                    <th scope="col">제목</th>
                    <th scope="col">작성자</th>
                    <th scope="col">👍</th>
                    <th scope="col">Hit</th>
                    <th scope="col">작성 날짜</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="post : ${posts}">
                    <td><a href="post_detail.html" th:href="@{|/posts/${post.postId}|}" th:text="${post.postId}">1</a></td>
                    <td><a href="post_detail.html" th:href="@{|/posts/${post.postId}|}" th:text="${post.postTitle}">제목</a></td>
                    <td th:text="${post.username}">작성자</td>
                    <td th:text="${post.postLike}">0</td>
                    <td th:text="${post.postHit}">0</td>
                    <td th:text="${#temporals.format(post.regDate, 'yyyy-MM-dd HH:mm:ss')}"></td>
                </tr>
            </tbody>
        </table>

        <!-- 페이징 -->
        <nav aria-label="Page navigation" class="mt-4">
            <ul class="pagination justify-content-center">
                <!-- 이전 버튼 -->
                <li class="page-item" th:classappend="${posts.first} ? 'disabled'">
                    <a class="page-link" th:href="@{|?page=${posts.number - 1}|}" aria-label="Previous">
                        <span aria-hidden="true">&laquo;</span>
                    </a>
                </li>

                <!-- 페이지 번호 -->
                <li class="page-item" th:each="i : ${#numbers.sequence(0, posts.totalPages - 1)}"
                    th:classappend="${i == posts.number} ? 'active'">
                    <a class="page-link" th:href="@{|?page=${i}|}" th:text="${i + 1}"></a>
                </li>

                <!-- 다음 버튼 -->
                <li class="page-item" th:classappend="${posts.last} ? 'disabled'">
                    <a class="page-link" th:href="@{|?page=${posts.number + 1}|}" aria-label="Next">
                        <span aria-hidden="true">&raquo;</span>
                    </a>
                </li>
            </ul>
        </nav>
    </div>
