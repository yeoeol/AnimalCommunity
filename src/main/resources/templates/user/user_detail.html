<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title>회원정보</title>
</head>
<div layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg">
                <div class="card-header text-center bg-primary text-white">
                    <h3>회원 정보</h3>
                </div>
                <div class="card-body">
                    <p class="mb-2"><strong>Username:</strong> <span th:text="${user.username}"></span></p>
                    <p class="mb-2"><strong>Email:</strong> <span th:text="${user.email}"></span></p>
                    <p class="mb-2"><strong>Create Date:</strong> <span th:text="${#temporals.format(user.createDate, 'yyyy-MM-dd HH:mm:ss')}"></span></p>
                </div>
                <div class="card-footer text-center">
                    <a th:href="@{|/user/modify/${user.userId}|}" class="btn btn-warning btn-sm">수정</a>
                </div>
            </div>
        </div>
    </div>
</div>
