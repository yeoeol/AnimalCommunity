<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title>회원정보 수정</title>
</head>
<div layout:fragment="content">
    <form th:action method="post">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-lg">
                    <div class="card-header text-center bg-primary text-white">
                        <h3>회원 정보</h3>
                    </div>
                    <div class="card-body">

                        <p class="mb-2"><strong>Username:</strong>
                            <input type="text" name="username" th:value="${user.username}">
                        </p>
                        <p class="mb-2"><strong>Email:</strong>
                            <input type="text" name="email" th:value="${user.email}">
                        </p>
                        <p class="mb-2"><strong>Password:</strong>
                            <input type="text" name="password" th:value="${user.password}">
                        </p>
                    </div>
                    <div class="card-footer text-center">
                        <input class="btn btn-warning btn-sm" type="submit" value="수정" onclick="alert('수정 완료!')">
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
